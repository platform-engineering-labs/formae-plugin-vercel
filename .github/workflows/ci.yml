name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # Nightly at 3 AM UTC
  workflow_dispatch:
    inputs:
      run_conformance:
        description: 'Run conformance tests'
        required: false
        default: 'false'
        type: boolean
      formae_version:
        description: 'Formae version to test against (default: latest)'
        required: false
        default: 'latest'
        type: string
      test_filter:
        description: 'Fixtures to run, comma separated. Default is the set
          expected to pass on a token and plan that allow them; clear it to run
          all eleven, including the five kept deliberately red for
          capabilities a token or plan may not have. Use literal names, not the
          harness regex form:
          TEST goes through make, which eats a bare $ and would silently turn
          an anchored /…$/ pattern into one that matches nothing.'
        required: false
        default: 'project,envvar,globalconfig,webhook,vcrrepository,route'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Build
        run: make build

      - name: Test
        run: make test-unit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: latest

  pkl-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Validate Pkl schemas
        run: |
          pkl eval formae-plugin.pkl --format json > /dev/null
          echo "Manifest validated successfully"

  verify-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Verify schema
        run: make verify-schema

  # Integration tests run against real infrastructure.
  # This job is disabled by default - enable it after configuring credentials.
  integration-tests:
    needs: [build, lint]
    runs-on: ubuntu-latest
    # Disabled by default - remove this condition after configuring credentials
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      # This job is disabled (if: false) — the plugin has no integration tests
      # separate from conformance. If it is ever enabled it needs VERCEL_TOKEN,
      # the same way the conformance job does.

      - name: Run integration tests
        run: make test-integration

  # Conformance tests run against real cloud resources.
  # This job is disabled by default - enable it after configuring credentials.
  #
  # To enable:
  # 1. Configure credentials for your cloud provider (see below)
  # 2. Implement scripts/ci/setup-credentials.sh for local credential verification
  # 3. Implement scripts/ci/clean-environment.sh for test resource cleanup
  # 4. Change the 'if' condition to enable the job
  conformance-tests:
    needs: [build, lint, pkl-validate, verify-schema]
    runs-on: ubuntu-latest
    # Every push to main, every pull request, nightly, and on demand. A pull
    # request from a fork gets no secrets, so the job logs a notice and exits 0
    # rather than failing — see the run step.
    if: >-
      ${{ github.event_name == 'push'
          || github.event_name == 'pull_request'
          || github.event_name == 'schedule'
          || github.event.inputs.run_conformance == 'true' }}
    timeout-minutes: 60

    # Conformance runs must not overlap. Resource *names* carry
    # FORMAE_TEST_RUN_ID, but scripts/ci/clean-environment.sh deletes every
    # resource matching the shared `formae-sdk-test` prefix, before and after the
    # run — so a second concurrent run would delete the first one's live
    # projects mid-apply and fail it for reasons that have nothing to do with
    # the code. One queue for the whole repository.
    #
    # cancel-in-progress is false on purpose: cancelling mid-apply abandons real
    # Vercel resources. Letting the run finish means its own post-test cleanup
    # removes them.
    concurrency:
      group: conformance-${{ github.repository }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        # Test against these formae versions. Expand as needed:
        # formae_version: ['0.78.0', '0.79.0', 'latest']
        formae_version: ['latest']

    # Uncomment and configure for your cloud provider:
    # permissions:
    #   id-token: write  # Required for OIDC
    #   contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Install plugin
        run: make install

      - name: Run conformance tests
        env:
          # The plugin reads its token from the environment and never from a
          # forma. VERCEL_TEAM_ID is optional: unset means the token's personal
          # account.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          # Isolates this run's resources from any other run's, so a nightly and
          # a manual dispatch cannot clean up each other's projects.
          FORMAE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          # Passed through to make as VERSION= only when it is a real semver.
          # The harness parses FORMAE_VERSION with semver and rejects "latest",
          # so that value must never reach it.
          REQUESTED_VERSION: ${{ inputs.formae_version || matrix.formae_version }}
          TEST_FILTER: ${{ inputs.test_filter || 'project,envvar,globalconfig,webhook,vcrrepository,route' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice title=Conformance skipped::VERCEL_TOKEN is not set on this repository. Add it under Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          # "latest" is the scaffold's sentinel for "no preference", not a
          # version the harness can parse. Translate it to passing nothing.
          VERSION_ARG=""
          case "$REQUESTED_VERSION" in
            ""|latest) echo "formae version: harness default" ;;
            *)         VERSION_ARG="VERSION=$REQUESTED_VERSION"
                       echo "formae version: $REQUESTED_VERSION" ;;
          esac

          # The default filter is the set that passes on an account with the
          # capabilities these fixtures need. Five fixtures are kept
          # deliberately red -- a removed test hides a gap, a red one names it --
          # so running all eleven exits non-zero by design. Dispatch with an
          # empty test_filter to see the whole picture.
          echo "fixtures: ${TEST_FILTER:-<all>}"
          make conformance-test TEST="$TEST_FILTER" $VERSION_ARG
