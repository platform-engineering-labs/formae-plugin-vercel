version = 1

# Files that cannot carry a comment header, or where one would be noise.
# Everything else declares its own SPDX-FileCopyrightText / SPDX-License-Identifier
# inline — see any .go or .pkl file for the shape.

# Configuration files
[[annotations]]
path = ["**/*.yml", "**/*.yaml", "**/*.json", "**/*.mod", "**/*.sum", "**/*.lock", "**/*.toml", ".gitignore", "**/.gitignore", "Makefile", "**/PklProject", "Opkgfile"]
SPDX-FileCopyrightText = "© 2026 Platform Engineering Labs Inc."
SPDX-License-Identifier = "FSL-1.1-ALv2"

# Shell scripts in scripts/ directory
[[annotations]]
path = ["scripts/**/*.sh"]
SPDX-FileCopyrightText = "© 2026 Platform Engineering Labs Inc."
SPDX-License-Identifier = "FSL-1.1-ALv2"

# Documentation files
[[annotations]]
path = ["**/*.md", "**/*.html"]
SPDX-FileCopyrightText = "© 2026 Platform Engineering Labs Inc."
SPDX-License-Identifier = "FSL-1.1-ALv2"

# Binary and generated test files
[[annotations]]
path = ["**/*.zip", "**/*.pcf", "**/*.log", "**/*.txt"]
SPDX-FileCopyrightText = "© 2026 Platform Engineering Labs Inc."
SPDX-License-Identifier = "FSL-1.1-ALv2"
